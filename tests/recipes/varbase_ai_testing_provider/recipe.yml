name: 'Varbase AI testing provider'
description: 'Testing only. Makes the AI module test provider (EchoAI) the default for every operation, so recipes that check for a default model apply in CI without an API key. Needs extension_discovery_scan_tests in settings.php.'
type: 'Testing'
install:
  - ai
  - ai_test
config:
  strict: false
  actions:
    ai.settings:
      simpleConfigUpdate:
        default_providers:
          chat:
            provider_id: echoai
            model_id: gpt-test
          chat_with_tools:
            provider_id: echoai
            model_id: gpt-test
          chat_with_image_vision:
            provider_id: echoai
            model_id: gpt-test
          chat_with_complex_json:
            provider_id: echoai
            model_id: gpt-test
          chat_with_structured_response:
            provider_id: echoai
            model_id: gpt-test
          embeddings:
            provider_id: echoai
            model_id: gpt-test
