name: 'Varbase AI testing OpenAI'
description: 'Testing only. Makes OpenAI the default AI provider, with the key read from the OPENAI_API_KEY environment variable. Used by the @ai-provider lane.'
type: 'Testing'
install:
  - key
  - ai
  - ai_provider_openai
config:
  strict: false
  actions:
    key.key.openai_api_key:
      createIfNotExists:
        label: 'OpenAI API key'
        description: 'Read from the OPENAI_API_KEY environment variable.'
        key_type: authentication
        key_type_settings: {  }
        key_provider: env
        key_provider_settings:
          env_variable: OPENAI_API_KEY
          strip_line_breaks: true
        key_input: none
        key_input_settings: {  }
    ai_provider_openai.settings:
      simpleConfigUpdate:
        api_key: openai_api_key
    ai.settings:
      simpleConfigUpdate:
        default_providers:
          chat:
            provider_id: openai
            model_id: gpt-4o-mini
          chat_with_tools:
            provider_id: openai
            model_id: gpt-4o-mini
          chat_with_image_vision:
            provider_id: openai
            model_id: gpt-4o-mini
          chat_with_complex_json:
            provider_id: openai
            model_id: gpt-4o-mini
          chat_with_structured_response:
            provider_id: openai
            model_id: gpt-4o-mini
          embeddings:
            provider_id: openai
            model_id: text-embedding-3-small
